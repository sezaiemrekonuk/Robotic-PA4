# Workspace
map:
  width: 1.5         # metres
  height: 1.5        # metres
  resolution: 0.05   # metres

# Mission
start: [0.15, 0.15]   # (x, y) world frame, metres
goal:  [1.35, 1.35]   # (x, y) world frame, metres

# initiate for y directly
start_theta_deg: 0.0   # robot starts physically pointing along +Y axis

# Obstacles
known_obstacles: []

unknown_obstacles: []

# Robot
robot:
  radius: 0.10           # body radius  (m)
  safety_margin: 0.08    # clearance for inflation
  baseline: 0.10         # distance between driven wheels  (m)
  wheel_radius: 0.0315   # driven wheel radius  (m)
  ticks_per_rev: 135     # encoder resolution  (ticks / revolution)
  speed_gain: 0.30

  # Motion speeds
  slow_speed: 0.12
  turn_speed_cmd: 0.12

  # Tolerances
  turn_tolerance: 0.05   # rad  — heading error to stop turning  (~2.9°)
  wp_tolerance: 0.06
  goal_tolerance: 0.10
  wp_timeout: 40.0

# DWA local planner
dwa:
  dt: 0.10
  horizon: 0.80

  v_samples: 8
  omega_samples: 13

  max_v: 0.18
  min_v: 0.00
  max_omega: 0.80
  max_accel: 0.40
  max_dyaw: 1.20

  # Cost weights — higher = more important
  weight_goal: 3.50
  weight_path: 0.50
  weight_obstacle: 6.00
  weight_velocity: 0.30
  clearance_threshold: 0.25

# Sensing
sensing:
  radius: 0.40
  fov_deg: 270.0

# ToF sensor
tof:
  enabled: true
  topic: ""
  register_min: 0.05
  register_max: 0.55
  stable_readings: 1
  stale_timeout: 1.0
  dedup_radius: 0.18
  mount_offset: 0.08

# Approach
approach:
  distance: 0.25
  min_speed: 0.05

# Timing
timing:
  move_rate: 10
  sense_pause: 1.0
  stop_hold_ticks: 3

# Path post-processing
path:
  min_spacing: 0.20
  angle_threshold: 0.25
  max_drift: 0.20

# Safety
max_backtracks: 5

# Visualisation
visualization:
  enabled: true
